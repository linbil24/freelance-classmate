<!-- Lightbox Modal -->
<div id="imgModal" class="img-modal" onclick="closeModal()">
    <span class="img-modal-close">&times;</span>
    <img id="imgModalContent" class="img-modal-img" src="" alt="">
</div>

<!-- Footer Axis -->
 <Footer>

                <h1 class="copyright"> Copyright &copy; 2023 Designed by: Celestre, Linbil Impuesto</h1>
            </div>
        </div>
 </Footer>

<script>
    function openModal(src) {
        document.getElementById('imgModal').style.display = 'flex';
        document.getElementById('imgModalContent').src = src;
    }
    function closeModal() {
        document.getElementById('imgModal').style.display = 'none';
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });
</script>
